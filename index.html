<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="base.css" />
    </head>
    <body>
        <section class="stats-section" aria-label="Todo statistics">
            <article class="stat-card">
                <h3 class="stat-title">Total Tasks</h3>
                <p class="stat-number" id="stat-total">2</p>
            </article>

    <article class="stat-card">
        <h3 class="stat-title">To Do</h3>
        <p class="stat-number" id="stat-todo">0</p>
    </article>

    <article class="stat-card">
        <h3 class="stat-title">In Progress</h3>
        <p class="stat-number" id="stat-doing">1</p>
    </article>

    <article class="stat-card">
        <h3 class="stat-title">Done</h3>
        <p class="stat-number" id="stat-done">1</p>
    </article>

    <article class="stat-card">
        <h3 class="stat-title">Achievement</h3>
    <p class="stat-number achievement" id="stat-achievement">50%</p>
    </article>
</section>
</html>
