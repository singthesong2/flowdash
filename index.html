<section class="search-section">
  
  <div class="search-all-box">
    
    <div class="search-left-box">
      
      <div class="search-search-box">
        <input type="search" placeholder="할 일 검색...">
        <button type="button" class="search-btn">🔍</button>
      </div>cd flowdash

      <div class="date-div">
        <select name="date-select">
          <option>전체 기간</option>
          <option>오늘</option>
          <option>최근 7일</option>
        </select>
        <select name="prio-select">
          <option>전체 우선순위</option>
          <option>낮음</option>
          <option>중간</option>
          <option>높음</option>
        </select>
        <select name="array-select">
          <option>정렬: 오름차순 ↑</option>
          <option>정렬: 내림차순 ↓</option>
        </select>
      </div>
    </div>

    <button type="button" class="add-work">+ 새 할 일</button>
    
  </div>

  <div class="prio-div">
    <button type="button" class="prio-btn">정렬: 오름차순</button>
    <button type="button" class="all-data-reset">전체 데이터 초기화</button>
  </div>

  <dialog class="new-dial"open>
    <form method="dialog" class="add-dial">
      <h2>새 할 일</h2>

      <div class="title-dial">
        <label>제목*</label>
        <input type="text" placeholder="할 일을 입력하세요...">
      </div>

      <div class="date-dial">
        <label>마감일</label>
        <input type="date">
      </div>

      <div class="prio-dial">
        <label>우선순위</label>
        <select>
          <option>낮음</option>
          <option>중간</option>
          <option>높음</option>
        </select>
      </div>

      <div class="dial-btn">
        <button type="button" class="dial-cancle-btn">취소</button>
        <button type="submit" class="dial-add-btn">추가하기</button>
      </div>
    </form>
  </dialog>
  
</section>
